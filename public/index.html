<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fish Wizard</title>
  <meta name="description" content="Snap or upload a photo of a fish and get a quick ID card." />
  <meta name="theme-color" content="#06283d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fish Wizard" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐠</text></svg>" />
  <style>
    :root {
      --deep: #041824;
      --sea: #06283d;
      --teal: #0e7490;
      --aqua: #22d3ee;
      --sun: #fde047;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.14);
      --text: #ecfeff;
      --muted: #9fc3cf;
      --card: #ffffff;
      --card-text: #0b2230;
      --card-muted: #557080;
      --error: #fecaca;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--deep); }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--text);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(120% 60% at 50% -10%, rgba(34, 211, 238, 0.35), transparent 60%),
        linear-gradient(180deg, var(--sea) 0%, var(--deep) 600px, var(--deep) 100%);
      background-repeat: no-repeat;
      min-height: 100vh;
    }
    main {
      max-width: 560px; margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 40px);
    }

    /* Header */
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .logo {
      width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-size: 28px;
      background: linear-gradient(135deg, var(--sun), #f59e0b); box-shadow: 0 6px 20px rgba(253, 224, 71, 0.25);
    }
    h1 { font-size: 28px; line-height: 1.1; margin: 0; letter-spacing: -0.02em; }
    .tagline { color: var(--muted); margin: 6px 0 24px; font-size: 16px; }

    /* Empty state */
    .drop {
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      gap: 6px; padding: 40px 20px; border-radius: 24px; cursor: pointer;
      background: var(--glass); border: 1.5px dashed var(--glass-border);
    }
    .drop .big { font-size: 56px; line-height: 1; animation: swim 3s ease-in-out infinite; }
    .drop strong { font-size: 19px; }
    .drop span { color: var(--muted); font-size: 15px; }
    @keyframes swim { 0%, 100% { transform: translateX(-8px) rotate(-3deg); } 50% { transform: translateX(8px) rotate(3deg); } }

    .actions { display: flex; gap: 10px; margin-top: 14px; }
    .btn {
      flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 52px; padding: 0 12px; border-radius: 16px; white-space: nowrap; font-size: 16px; border: 1px solid var(--glass-border);
      background: var(--glass); color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
      transition: transform .1s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn.primary { background: linear-gradient(135deg, var(--aqua), var(--teal)); border-color: transparent; color: #022c3a; }
    input[type=file] { display: none; }

    /* Photo + scanning */
    .stage { position: relative; display: none; margin-top: 4px; }
    .photo-wrap { position: relative; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45); }
    .photo-wrap img { display: block; width: 100%; max-height: 52vh; object-fit: cover; }
    .scan { position: absolute; inset: 0; display: none; pointer-events: none; }
    .scanning .scan { display: block; }
    .scan::before {
      content: ""; position: absolute; left: 0; right: 0; height: 30%;
      background: linear-gradient(180deg, transparent, rgba(34, 211, 238, 0.45), transparent);
      animation: sweep 1.6s ease-in-out infinite;
    }
    .scan::after { content: ""; position: absolute; inset: 0; background: rgba(4, 24, 36, 0.25); }
    @keyframes sweep { 0% { top: -30%; } 100% { top: 100%; } }
    .bubble-dot {
      position: absolute; bottom: -20px; width: 10px; height: 10px; border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.7); animation: rise 2.4s ease-in infinite; z-index: 2;
    }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-340px); opacity: 0; } }
    .status {
      position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 3;
      background: rgba(4, 24, 36, 0.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      padding: 8px 16px; border-radius: 99px; font-size: 15px; font-weight: 600; white-space: nowrap; display: none;
    }
    .scanning .status { display: block; }

    /* Result card */
    .card {
      position: relative; margin: -36px 12px 0; padding: 20px 20px 18px; border-radius: 24px; z-index: 4;
      background: var(--card); color: var(--card-text); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      display: none; animation: pop .35s cubic-bezier(.2, .9, .3, 1.2);
    }
    .card::before { /* speech-bubble tail */
      content: ""; position: absolute; top: -9px; left: 32px; width: 20px; height: 20px;
      background: var(--card); transform: rotate(45deg); border-radius: 4px;
    }
    @keyframes pop { from { transform: translateY(16px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
    .card h2 { margin: 0; font-size: 24px; line-height: 1.2; letter-spacing: -0.01em; }
    .sci { font-style: italic; color: var(--card-muted); margin-top: 2px; }
    .aka { color: var(--card-muted); font-size: 14.5px; margin-top: 2px; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .pill { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: #e6f6fa; color: #0e5a6e; }
    .pill.high { background: #dcfce7; color: #166534; }
    .pill.medium { background: #fef9c3; color: #854d0e; }
    .pill.low { background: #fee2e2; color: #991b1b; }
    .summary { margin: 12px 0 4px; font-size: 16.5px; }
    .facts { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; }
    .facts li { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; font-size: 15.5px; }
    .facts .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #f0f9fb; font-size: 18px; }
    .facts b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--card-muted); }
    .note { margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: #f6f8f9; color: var(--card-muted); font-size: 14.5px; }
    .card.error { background: #3b1219; color: var(--error); }
    .card.error::before { background: #3b1219; }
    .card.error h2 { font-size: 19px; }
    .card .btn { margin-top: 14px; width: 100%; }
    .card.error .btn { background: rgba(255, 255, 255, 0.1); color: #fff; border-color: rgba(255, 255, 255, 0.2); }

    .again { display: none; margin-top: 16px; }

    footer { margin-top: 28px; color: var(--muted); font-size: 12.5px; text-align: center; opacity: .8; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
<main>
  <header>
    <div class="logo">🐠</div>
    <h1>Fish Wizard</h1>
  </header>
  <p class="tagline" data-i18n="tagline">Snap a fish, get its name and a few fun facts.</p>

  <section id="empty">
    <label class="drop" for="library">
      <div class="big">🐟</div>
      <strong data-i18n="identify">Identify a fish</strong>
      <span data-i18n="examples">Underwater shots, aquarium photos, market catch…</span>
    </label>
    <div class="actions">
      <label class="btn primary" for="camera">📷 <span data-i18n="take">Take photo</span></label>
      <label class="btn" for="library">🖼️ <span data-i18n="choose">Choose photo</span></label>
    </div>
  </section>

  <section id="stage" class="stage">
    <div class="photo-wrap">
      <img id="preview" alt="Your photo" />
      <div class="scan"></div>
      <div class="status" id="status">Looking closely…</div>
    </div>
    <div id="card" class="card" aria-live="polite"></div>
    <div class="actions again" id="again">
      <label class="btn primary" for="camera">📷 <span data-i18n="newPhoto">New photo</span></label>
      <label class="btn" for="library">🖼️ <span data-i18n="pickAnother">Pick another</span></label>
    </div>
  </section>

  <input id="camera" type="file" accept="image/*" capture="environment" />
  <input id="library" type="file" accept="image/*" />

  <footer data-i18n="disclaimer">AI identification can be wrong. Don't rely on it to judge whether a fish is safe to touch or eat.</footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), card = $("card"), statusEl = $("status");
  const ICONS = { Appearance: "🎨", Habitat: "🌊", Behavior: "🐟", Diet: "🦐", Size: "📏", Safety: "⚠️" };
  // ---- Language: follow the phone's settings ----
  const I18N = {
    en: {
      tagline: "Snap a fish, get its name and a few fun facts.", identify: "Identify a fish",
      examples: "Underwater shots, aquarium photos, market catch…", take: "Take photo", choose: "Choose photo",
      newPhoto: "New photo", pickAnother: "Pick another",
      disclaimer: "AI identification can be wrong. Don't rely on it to judge whether a fish is safe to touch or eat.",
      status: ["Looking closely…", "Checking fins and colors…", "Comparing species…", "Almost there…"],
      alsoCalled: "Also called", confidence: { high: "High confidence", medium: "Medium confidence", low: "Low confidence" },
      labels: { Appearance: "Appearance", Habitat: "Habitat", Behavior: "Behavior", Diet: "Diet", Size: "Size", Safety: "Safety" },
      noFish: "No fish spotted 🤔", retry: "Try again",
      errBusy: "The fish expert is busy right now. Please try again in a minute.",
      errLimit: "Free daily limit reached. Try again later.", errPhoto: "Sorry, this photo couldn't be analyzed.",
      errRead: "Couldn't read that image. Try another photo.", errOffline: "No connection. Check your signal and try again.",
      errGeneric: "Something went wrong. Please try again.",
    },
    es: {
      tagline: "Fotografía un pez y descubre su nombre y algunos datos curiosos.", identify: "Identifica un pez",
      examples: "Fotos bajo el agua, de acuario, del mercado…", take: "Tomar foto", choose: "Elegir foto",
      newPhoto: "Nueva foto", pickAnother: "Elegir otra",
      disclaimer: "La identificación con IA puede fallar. No te fíes de ella para saber si un pez es seguro de tocar o comer.",
      status: ["Mirando con atención…", "Revisando aletas y colores…", "Comparando especies…", "Casi listo…"],
      alsoCalled: "También llamado", confidence: { high: "Confianza alta", medium: "Confianza media", low: "Confianza baja" },
      labels: { Appearance: "Apariencia", Habitat: "Hábitat", Behavior: "Comportamiento", Diet: "Dieta", Size: "Tamaño", Safety: "Seguridad" },
      noFish: "No se ve ningún pez 🤔", retry: "Reintentar",
      errBusy: "El experto en peces está ocupado. Inténtalo de nuevo en un minuto.",
      errLimit: "Se alcanzó el límite gratuito de hoy. Inténtalo más tarde.", errPhoto: "Lo sentimos, no se pudo analizar esta foto.",
      errRead: "No se pudo leer la imagen. Prueba con otra foto.", errOffline: "Sin conexión. Revisa tu señal e inténtalo de nuevo.",
      errGeneric: "Algo salió mal. Inténtalo de nuevo.",
    },
    pt: {
      tagline: "Fotografe um peixe e descubra o nome e algumas curiosidades.", identify: "Identifique um peixe",
      examples: "Fotos subaquáticas, de aquário, da feira…", take: "Tirar foto", choose: "Escolher foto",
      newPhoto: "Nova foto", pickAnother: "Escolher outra",
      disclaimer: "A identificação por IA pode errar. Não confie nela para saber se um peixe é seguro para tocar ou comer.",
      status: ["Olhando com atenção…", "Verificando nadadeiras e cores…", "Comparando espécies…", "Quase lá…"],
      alsoCalled: "Também chamado de", confidence: { high: "Confiança alta", medium: "Confiança média", low: "Confiança baixa" },
      labels: { Appearance: "Aparência", Habitat: "Habitat", Behavior: "Comportamento", Diet: "Dieta", Size: "Tamanho", Safety: "Segurança" },
      noFish: "Nenhum peixe encontrado 🤔", retry: "Tentar de novo",
      errBusy: "O especialista em peixes está ocupado. Tente de novo em um minuto.",
      errLimit: "Limite gratuito de hoje atingido. Tente mais tarde.", errPhoto: "Desculpe, não foi possível analisar esta foto.",
      errRead: "Não foi possível ler a imagem. Tente outra foto.", errOffline: "Sem conexão. Verifique o sinal e tente de novo.",
      errGeneric: "Algo deu errado. Tente de novo.",
    },
    fr: {
      tagline: "Photographiez un poisson et découvrez son nom et quelques anecdotes.", identify: "Identifier un poisson",
      examples: "Photos sous-marines, d'aquarium, du marché…", take: "Prendre une photo", choose: "Choisir une photo",
      newPhoto: "Nouvelle photo", pickAnother: "En choisir une autre",
      disclaimer: "L'identification par IA peut se tromper. Ne vous y fiez pas pour savoir si un poisson peut être touché ou mangé.",
      status: ["Examen attentif…", "Analyse des nageoires et des couleurs…", "Comparaison des espèces…", "Presque fini…"],
      alsoCalled: "Aussi appelé", confidence: { high: "Confiance élevée", medium: "Confiance moyenne", low: "Confiance faible" },
      labels: { Appearance: "Apparence", Habitat: "Habitat", Behavior: "Comportement", Diet: "Alimentation", Size: "Taille", Safety: "Sécurité" },
      noFish: "Aucun poisson repéré 🤔", retry: "Réessayer",
      errBusy: "L'expert en poissons est occupé. Réessayez dans une minute.",
      errLimit: "Limite gratuite du jour atteinte. Réessayez plus tard.", errPhoto: "Désolé, cette photo n'a pas pu être analysée.",
      errRead: "Impossible de lire cette image. Essayez une autre photo.", errOffline: "Pas de connexion. Vérifiez votre réseau et réessayez.",
      errGeneric: "Une erreur s'est produite. Réessayez.",
    },
    de: {
      tagline: "Fotografiere einen Fisch und erfahre seinen Namen und spannende Fakten.", identify: "Fisch bestimmen",
      examples: "Unterwasserfotos, Aquarium, Fischmarkt…", take: "Foto aufnehmen", choose: "Foto wählen",
      newPhoto: "Neues Foto", pickAnother: "Anderes wählen",
      disclaimer: "KI-Bestimmungen können falsch sein. Verlass dich nicht darauf, ob ein Fisch sicher zum Anfassen oder Essen ist.",
      status: ["Genau hinsehen…", "Flossen und Farben prüfen…", "Arten vergleichen…", "Fast fertig…"],
      alsoCalled: "Auch genannt", confidence: { high: "Hohe Sicherheit", medium: "Mittlere Sicherheit", low: "Geringe Sicherheit" },
      labels: { Appearance: "Aussehen", Habitat: "Lebensraum", Behavior: "Verhalten", Diet: "Nahrung", Size: "Größe", Safety: "Sicherheit" },
      noFish: "Kein Fisch entdeckt 🤔", retry: "Erneut versuchen",
      errBusy: "Der Fischexperte ist gerade beschäftigt. Versuch es in einer Minute noch einmal.",
      errLimit: "Tägliches Gratislimit erreicht. Versuch es später.", errPhoto: "Dieses Foto konnte leider nicht analysiert werden.",
      errRead: "Das Bild konnte nicht gelesen werden. Versuch ein anderes Foto.", errOffline: "Keine Verbindung. Prüfe dein Netz und versuch es erneut.",
      errGeneric: "Etwas ist schiefgelaufen. Bitte erneut versuchen.",
    },
    it: {
      tagline: "Fotografa un pesce e scopri il suo nome e qualche curiosità.", identify: "Identifica un pesce",
      examples: "Foto subacquee, d'acquario, del mercato…", take: "Scatta foto", choose: "Scegli foto",
      newPhoto: "Nuova foto", pickAnother: "Scegline un'altra",
      disclaimer: "L'identificazione con l'IA può sbagliare. Non affidarti a essa per capire se un pesce è sicuro da toccare o mangiare.",
      status: ["Osservo con attenzione…", "Controllo pinne e colori…", "Confronto le specie…", "Quasi fatto…"],
      alsoCalled: "Chiamato anche", confidence: { high: "Affidabilità alta", medium: "Affidabilità media", low: "Affidabilità bassa" },
      labels: { Appearance: "Aspetto", Habitat: "Habitat", Behavior: "Comportamento", Diet: "Dieta", Size: "Dimensioni", Safety: "Sicurezza" },
      noFish: "Nessun pesce trovato 🤔", retry: "Riprova",
      errBusy: "L'esperto di pesci è occupato. Riprova tra un minuto.",
      errLimit: "Limite gratuito giornaliero raggiunto. Riprova più tardi.", errPhoto: "Spiacenti, non è stato possibile analizzare questa foto.",
      errRead: "Impossibile leggere l'immagine. Prova un'altra foto.", errOffline: "Nessuna connessione. Controlla il segnale e riprova.",
      errGeneric: "Qualcosa è andato storto. Riprova.",
    },
  };
  I18N.ca = {
    tagline: "Fotografia un peix i descobreix-ne el nom i algunes curiositats.", identify: "Identifica un peix",
    examples: "Fotos sota l'aigua, d'aquari, del mercat…", take: "Fes una foto", choose: "Tria una foto",
    newPhoto: "Nova foto", pickAnother: "Tria'n una altra",
    disclaimer: "La identificació amb IA pot fallar. No t'hi refiïs per saber si un peix és segur de tocar o de menjar.",
    status: ["Mirant amb atenció…", "Revisant aletes i colors…", "Comparant espècies…", "Gairebé a punt…"],
    alsoCalled: "També anomenat", confidence: { high: "Confiança alta", medium: "Confiança mitjana", low: "Confiança baixa" },
    labels: { Appearance: "Aparença", Habitat: "Hàbitat", Behavior: "Comportament", Diet: "Dieta", Size: "Mida", Safety: "Seguretat" },
    noFish: "No es veu cap peix 🤔", retry: "Torna-ho a provar",
    errBusy: "L'expert en peixos està ocupat. Torna-ho a provar d'aquí a un minut.",
    errLimit: "S'ha arribat al límit gratuït d'avui. Torna-ho a provar més tard.", errPhoto: "Ho sentim, no s'ha pogut analitzar aquesta foto.",
    errRead: "No s'ha pogut llegir la imatge. Prova amb una altra foto.", errOffline: "Sense connexió. Revisa la cobertura i torna-ho a provar.",
    errGeneric: "Alguna cosa ha anat malament. Torna-ho a provar.",
  };
  const LANG = (navigator.languages?.[0] || navigator.language || "en").replace("_", "-");
  const T = I18N[LANG.split("-")[0].toLowerCase()] || I18N.en;
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = T[el.dataset.i18n]; });
  const STATUS = T.status;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let lastImage = null, statusTimer = null;

  for (const id of ["camera", "library"]) {
    $(id).addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      e.target.value = "";
      if (!file) return;
      try {
        lastImage = await toJpegBase64(file);
      } catch (err) {
        return showStage(), showError(err.message, false);
      }
      $("preview").src = lastImage.dataUrl;
      identify();
    });
  }

  // Downscale to JPEG (also converts iPhone HEIC photos, since Safari decodes them).
  async function toJpegBase64(file, maxSide = 1280) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((resolve, reject) => {
        const i = new Image();
        i.onload = () => resolve(i);
        i.onerror = () => reject(new Error(T.errRead));
        i.src = url;
      });
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
      return { dataUrl, base64: dataUrl.split(",")[1] };
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function showStage() {
    $("empty").style.display = "none";
    stage.style.display = "block";
  }

  function setScanning(on) {
    stage.classList.toggle("scanning", on);
    clearInterval(statusTimer);
    document.querySelectorAll(".bubble-dot").forEach((b) => b.remove());
    $("again").style.display = on ? "none" : "flex";
    if (!on) return;
    let i = 0;
    statusEl.textContent = STATUS[0];
    statusTimer = setInterval(() => { statusEl.textContent = STATUS[Math.min(++i, STATUS.length - 1)]; }, 2200);
    const wrap = document.querySelector(".photo-wrap");
    for (let k = 0; k < 7; k++) {
      const b = document.createElement("span");
      b.className = "bubble-dot";
      b.style.left = `${10 + Math.random() * 80}%`;
      b.style.animationDelay = `${Math.random() * 2.4}s`;
      const size = 6 + Math.random() * 10;
      b.style.width = b.style.height = `${size}px`;
      wrap.appendChild(b);
    }
  }

  async function identify() {
    showStage();
    card.style.display = "none";
    setScanning(true);
    try {
      const r = await fetch("/api/identify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: lastImage.base64, mediaType: "image/jpeg", lang: LANG }),
      });
      const data = await r.json().catch(() => null);
      if (!r.ok || !data) {
        throw new Error(r.status === 429 ? T.errLimit : r.status === 422 ? T.errPhoto
          : r.status === 502 || r.status === 503 ? T.errBusy : T.errGeneric);
      }
      setScanning(false);
      render(data);
    } catch (err) {
      setScanning(false);
      showError(err instanceof TypeError ? T.errOffline : err.message, true);
    }
  }

  function showCard(html, isError) {
    card.className = "card" + (isError ? " error" : "");
    card.innerHTML = html;
    card.style.display = "block";
    card.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function showError(msg, canRetry) {
    showCard(`<h2>😕 ${esc(msg)}</h2>${canRetry ? '<button class="btn" id="retry">↻ ${esc(T.retry)}</button>' : ""}`, true);
    $("retry")?.addEventListener("click", identify);
  }

  function render(d) {
    if (!d.found) {
      showCard(`<h2>${esc(T.noFish)}</h2><p class="summary">${esc(d.summary)}</p>`);
      return;
    }
    // If the model fell back to the Latin name, show the English name as the title instead of repeating it.
    if (d.english_name && (!d.common_name || d.common_name === d.scientific_name)) d.common_name = d.english_name;
    const aka = d.other_names?.length ? `<div class="aka">${esc(T.alsoCalled)} ${d.other_names.map(esc).join(", ")}</div>` : "";
    const facts = (d.facts || []).map((f) => `
      <li><span class="ico">${ICONS[f.label] || "🐠"}</span>
        <div><b>${esc(T.labels[f.label] || f.label)}</b>${esc(f.text)}</div></li>`).join("");
    showCard(`
      <h2>${esc(d.common_name)}</h2>
      <div class="sci">${esc(d.scientific_name)}</div>
      ${aka}
      <div class="meta"><span class="pill ${esc(d.confidence)}">${esc(T.confidence[d.confidence] || d.confidence)}</span></div>
      <p class="summary">${esc(d.summary)}</p>
      <ul class="facts">${facts}</ul>
      ${d.note ? `<div class="note">💡 ${esc(d.note)}</div>` : ""}
    `);
  }
</script>
</body>
</html>

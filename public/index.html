<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fish Wizard</title>
  <meta name="description" content="Snap or upload a photo of a fish and get a quick ID card." />
  <meta name="theme-color" content="#0b5f7a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fish Wizard" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐠</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" />
  <style>
    /* One dark underwater world: sunlit surface at the top fading into deep water. */
    :root {
      color-scheme: dark;
      --surface: #2ad0e0; --shallow: #0b5f7a; --deep: #06263a; --abyss: #020d16;
      --glow: #7cf3ff; --ink: #e9fbff; --ink-soft: #a7c9d6;
      --glass: rgba(190, 240, 255, 0.07); --glass-strong: rgba(190, 240, 255, 0.12); --glass-line: rgba(190, 240, 255, 0.18);
      --card: #fbfdfd; --card-ink: #0a2230; --card-soft: #587485;
      --danger-bg: #3a1620; --danger-ink: #ffd5d5;
      --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
      --body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html { background: var(--abyss); }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); font: 16px/1.5 var(--body);
      background:
        radial-gradient(140% 600px at 50% -120px, rgba(42, 208, 224, 0.55), transparent 60%),
        linear-gradient(180deg, var(--shallow) 0px, var(--deep) 420px, var(--abyss) 1000px, var(--abyss) 100%);
      background-repeat: no-repeat;
    }
    .rays { position: fixed; top: -10%; left: -30%; right: -30%; height: 60vh; z-index: 0; pointer-events: none; filter: blur(14px); opacity: .5;
      background: repeating-conic-gradient(from 168deg at 50% -8%, rgba(124,243,255,0) 0deg 5deg, rgba(124,243,255,.22) 6deg 8deg, rgba(124,243,255,0) 9deg 14deg);
      mask-image: linear-gradient(180deg, #000, transparent 85%); -webkit-mask-image: linear-gradient(180deg, #000, transparent 85%);
      animation: sway 9s ease-in-out infinite alternate; transform-origin: 50% 0; }
    @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
    canvas.snow { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    main { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; gap: 18px;
      padding: calc(env(safe-area-inset-top) + 22px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(16px, env(safe-area-inset-left)); }
    .view { display: flex; flex-direction: column; gap: 18px; }

    /* Header */
    .top { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; font: inherit; }
    .mark { width: 44px; height: 44px; flex: none; border-radius: 14px; display: grid; place-items: center;
      background: linear-gradient(150deg, #ffe27a, #ffb347); box-shadow: 0 8px 24px rgba(255,179,71,.35), inset 0 1px 0 rgba(255,255,255,.6); }
    .brand { font-family: var(--display); font-weight: 800; font-size: 25px; letter-spacing: -0.02em; line-height: 1; }
    .brand small { display: block; font: 500 13px var(--body); color: var(--ink-soft); letter-spacing: 0; margin-top: 4px; }

    /* Start */
    .hero { position: relative; padding: 34px 20px 26px; border-radius: 28px; text-align: center; cursor: pointer;
      background: linear-gradient(180deg, var(--glass-strong), var(--glass)); border: 1px solid var(--glass-line);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: block; }
    .sonar { position: relative; width: 132px; height: 132px; margin: 0 auto 14px; display: grid; place-items: center; }
    .sonar span { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(124,243,255,.45); animation: ping 3s ease-out infinite; }
    .sonar span:nth-child(2) { animation-delay: 1s; } .sonar span:nth-child(3) { animation-delay: 2s; }
    @keyframes ping { from { transform: scale(.45); opacity: .9; } to { transform: scale(1.15); opacity: 0; } }
    .sonar svg { position: relative; animation: bob 3.2s ease-in-out infinite; filter: drop-shadow(0 8px 16px rgba(0,0,0,.35)); }
    @keyframes bob { 0%,100% { transform: translate(-4px, 2px) rotate(-3deg); } 50% { transform: translate(4px, -3px) rotate(3deg); } }
    .hero h1 { font-family: var(--display); font-weight: 800; font-size: 26px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
    .hero p { margin: 6px auto 0; color: var(--ink-soft); max-width: 28ch; line-height: 1.45; }
    .tips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .tip { font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 99px; background: rgba(124,243,255,.1); border: 1px solid rgba(124,243,255,.2); }

    /* Buttons */
    .btns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 56px; padding: 0 12px; border-radius: 18px;
      font: 600 16px var(--body); white-space: nowrap; cursor: pointer; border: 0; color: var(--ink); transition: transform .12s ease; overflow: hidden; text-overflow: ellipsis; }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible, .mini:focus-visible, .top:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
    .btn svg, .mini svg { flex: none; }
    .btn.primary { color: #032532; background: linear-gradient(180deg, #a6f8ff, var(--glow) 45%, #2bc3d6);
      box-shadow: 0 10px 28px rgba(124,243,255,.35), inset 0 1px 0 rgba(255,255,255,.8), inset 0 -2px 0 rgba(0,80,100,.25); }
    .btn.ghost { background: var(--glass-strong); border: 1px solid var(--glass-line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
    .btn.wide { grid-column: 1 / -1; }
    input[type=file] { display: none; }

    /* Crop */
    .h2 { font-family: var(--display); font-weight: 800; font-size: 21px; margin: 0; }
    .sub { margin: -12px 0 0; color: var(--ink-soft); font-size: 14.5px; }
    .cropper { position: relative; width: fit-content; max-width: 100%; margin: 0 auto; border-radius: 18px; overflow: hidden; touch-action: none;
      user-select: none; -webkit-user-select: none; border: 1px solid var(--glass-line); box-shadow: 0 24px 50px rgba(0,0,0,.5); }
    .cropper img { display: block; max-width: 100%; max-height: 56vh; pointer-events: none; }
    .box { position: absolute; border: 2px solid #fff; border-radius: 6px; box-shadow: 0 0 0 9999px rgba(2,13,22,.62); cursor: move; touch-action: none; }
    .box::before { content: ""; position: absolute; left: 33.3%; right: 33.3%; top: 0; bottom: 0; border-left: 1px solid rgba(255,255,255,.35); border-right: 1px solid rgba(255,255,255,.35); }
    .box::after { content: ""; position: absolute; top: 33.3%; bottom: 33.3%; left: 0; right: 0; border-top: 1px solid rgba(255,255,255,.35); border-bottom: 1px solid rgba(255,255,255,.35); }
    .hd { position: absolute; width: 36px; height: 36px; z-index: 2; }
    .hd::after { content: ""; position: absolute; width: 18px; height: 18px; border: 4px solid var(--glow); }
    .hd.nw { left: -10px; top: -10px; } .hd.nw::after { left: 6px; top: 6px; border-right: 0; border-bottom: 0; border-top-left-radius: 6px; }
    .hd.ne { right: -10px; top: -10px; } .hd.ne::after { right: 6px; top: 6px; border-left: 0; border-bottom: 0; border-top-right-radius: 6px; }
    .hd.sw { left: -10px; bottom: -10px; } .hd.sw::after { left: 6px; bottom: 6px; border-right: 0; border-top: 0; border-bottom-left-radius: 6px; }
    .hd.se { right: -10px; bottom: -10px; } .hd.se::after { right: 6px; bottom: 6px; border-left: 0; border-top: 0; border-bottom-right-radius: 6px; }
    .hint { text-align: center; font-size: 13px; color: var(--ink-soft); margin: -6px 0 0; }

    /* Photo + scanning */
    .photo { position: relative; border-radius: 26px; overflow: hidden; box-shadow: 0 24px 50px rgba(0,0,0,.5); border: 1px solid var(--glass-line); }
    .photo img { display: block; width: 100%; max-height: 52vh; object-fit: cover; }
    .scanbox { position: absolute; inset: 0; pointer-events: none; display: none; }
    .scanning .scanbox { display: block; }
    .scanbox::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(2,13,22,.15), rgba(2,13,22,.45)); }
    .scanbox .line { position: absolute; left: 0; right: 0; height: 2px; background: var(--glow); box-shadow: 0 0 18px 6px rgba(124,243,255,.5); animation: scan 2s ease-in-out infinite alternate; }
    @keyframes scan { from { top: 8%; } to { top: 92%; } }
    .scanbox .corner { position: absolute; width: 26px; height: 26px; border: 3px solid var(--glow); border-radius: 6px; }
    .scanbox .c1 { top: 14px; left: 14px; border-right: 0; border-bottom: 0; } .scanbox .c2 { top: 14px; right: 14px; border-left: 0; border-bottom: 0; }
    .scanbox .c3 { bottom: 14px; left: 14px; border-right: 0; border-top: 0; } .scanbox .c4 { bottom: 14px; right: 14px; border-left: 0; border-top: 0; }
    .chip { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px;
      border-radius: 99px; background: rgba(2,13,22,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-weight: 600; font-size: 14.5px;
      white-space: nowrap; border: 1px solid var(--glass-line); max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
    .dots { display: inline-flex; gap: 3px; } .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--glow); animation: dot 1.2s infinite; }
    .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes dot { 0%,80%,100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
    .steps { display: none; justify-content: center; gap: 6px; }
    .scanning + .steps { display: flex; }
    .steps span { height: 4px; width: 28px; border-radius: 4px; background: var(--glass-line); transition: background .3s; }
    .steps span.on { background: var(--glow); }

    /* Result card */
    .card { position: relative; margin: -46px 10px 0; padding: 20px 18px 16px; border-radius: 26px; background: var(--card); color: var(--card-ink); z-index: 2;
      box-shadow: 0 22px 48px rgba(0,0,0,.4); animation: pop .4s cubic-bezier(.2,.9,.3,1.25); }
    .card::before { content: ""; position: absolute; top: -8px; left: 34px; width: 18px; height: 18px; background: inherit; transform: rotate(45deg); border-radius: 4px; }
    @keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
    .card h2 { font-family: var(--display); font-weight: 800; font-size: 25px; line-height: 1.1; margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
    .sci { font-style: italic; color: var(--card-soft); margin-top: 3px; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
    .conf { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: #dcfce7; color: #166534; }
    .conf.medium { background: #fef9c3; color: #854d0e; } .conf.low { background: #fee2e2; color: #991b1b; }
    .conf .bar { display: inline-flex; gap: 2px; } .conf .bar i { width: 4px; height: 10px; border-radius: 2px; background: currentColor; }
    .conf .bar i.off { opacity: .25; }
    .aka { font-size: 13.5px; color: var(--card-soft); }
    .summary { margin: 12px 0 2px; font-size: 16px; line-height: 1.5; }
    .facts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 12px; }
    .fact { padding: 11px 12px; border-radius: 16px; background: #eef7f9; min-width: 0; }
    .fact.full { grid-column: 1 / -1; }
    .fact b { display: flex; align-items: center; gap: 6px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: #0e6a80; }
    .fact p { margin: 4px 0 0; font-size: 14.5px; line-height: 1.4; }
    .note { margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: #fff4ec; color: #8a3f1c; font-size: 14px; line-height: 1.4; }
    .card-actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 14px; }
    .mini { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 12px; border: 1px solid #d5e5ea;
      background: #fff; color: var(--card-ink); font: 600 14px var(--body); cursor: pointer; white-space: nowrap; }
    .card.err { background: var(--danger-bg); color: var(--danger-ink); }
    .card.err h2 { font-size: 20px; }
    .card.err p { margin: 6px 0 0; color: #f3b5b5; line-height: 1.45; }
    .card.err .btn { width: 100%; margin-top: 14px; min-height: 50px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #fff; }

    /* Saved card */
    .fishcard { display: block; width: 100%; border-radius: 22px; box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px var(--glass-line); }
    .card-hint { text-align: center; color: var(--ink-soft); font-size: 13.5px; margin: -6px 0 0; }

    .foot { margin-top: auto; padding-top: 8px; text-align: center; font-size: 12px; color: var(--ink-soft); opacity: .75; line-height: 1.4; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
<div class="rays" aria-hidden="true"></div>
<canvas class="snow" id="snow" aria-hidden="true"></canvas>

<main>
  <button class="top" type="button" id="home" aria-label="Fish Wizard home">
    <span class="mark"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 16c4-7 12-9 19-5l5-4v18l-5-4c-7 4-15 2-19-5z" fill="#0a2a3a"/><circle cx="11" cy="14.5" r="1.8" fill="#ffe27a"/><path d="M15 11.5c1.5 3 1.5 6 0 9" stroke="#ffe27a" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></span>
    <span class="brand">Fish Wizard<small data-i18n="tagline">Snap a fish, get its name and fun facts</small></span>
  </button>

  <!-- Start -->
  <section class="view" id="v-start">
    <label class="hero" for="library">
      <div class="sonar" aria-hidden="true"><span></span><span></span><span></span>
        <svg width="92" height="70" viewBox="0 0 92 70"><defs><linearGradient id="fb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#ffb02e"/></linearGradient></defs>
          <path d="M8 35C18 14 44 6 64 20l18-14v58L64 50C44 64 18 56 8 35z" fill="url(#fb)"/>
          <path d="M34 16c5 12 5 26 0 38M46 14c4 13 4 29 0 42" stroke="#e08a12" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".7"/>
          <circle cx="22" cy="31" r="6" fill="#2f5d8a"/><circle cx="21" cy="30" r="2.6" fill="#0a1a26"/><circle cx="20" cy="29" r="1" fill="#fff"/></svg>
      </div>
      <h1 data-i18n="heroTitle">What fish is that?</h1>
      <p data-i18n="heroSub">Take or choose a photo and get its name in seconds.</p>
      <div class="tips" id="tips"></div>
    </label>
    <div class="btns">
      <label class="btn primary" for="camera"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.4A1.5 1.5 0 0 1 9.9 5h4.2a1.5 1.5 0 0 1 1.3.6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg><span data-i18n="take">Take photo</span></label>
      <label class="btn ghost" for="library"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg><span data-i18n="choose">Choose photo</span></label>
    </div>
  </section>

  <!-- Crop -->
  <section class="view" id="v-crop" hidden>
    <h2 class="h2" data-i18n="cropTitle">Frame the fish</h2>
    <p class="sub" data-i18n="cropSub">Drag the box over the fish you want identified.</p>
    <div class="cropper" id="cropper">
      <img id="crop-img" alt="" />
      <div class="box" id="box"><span class="hd nw" data-h="nw"></span><span class="hd ne" data-h="ne"></span><span class="hd sw" data-h="sw"></span><span class="hd se" data-h="se"></span></div>
    </div>
    <p class="hint" data-i18n="cropHint">Drag corners to resize · drag inside to move</p>
    <div class="btns">
      <button type="button" class="btn primary wide" id="use-crop"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg><span data-i18n="identifyArea">Identify this area</span></button>
      <button type="button" class="btn ghost wide" id="use-whole" data-i18n="useWhole">Use whole photo</button>
    </div>
  </section>

  <!-- Scanning / result / error -->
  <section class="view" id="v-photo" hidden>
    <div class="photo" id="photo">
      <img id="preview" alt="" />
      <div class="scanbox"><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span><div class="line"></div>
        <div class="chip"><span class="dots"><i></i><i></i><i></i></span><span id="status"></span></div></div>
    </div>
    <div class="steps" aria-hidden="true"><span></span><span></span><span></span></div>
    <article class="card" id="card" aria-live="polite" hidden></article>
    <div class="btns" id="err-btns" hidden>
      <label class="btn primary" for="camera"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.4A1.5 1.5 0 0 1 9.9 5h4.2a1.5 1.5 0 0 1 1.3.6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg><span data-i18n="newPhoto">New photo</span></label>
      <label class="btn ghost" for="library"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg><span data-i18n="pickAnother">Pick another</span></label>
    </div>
  </section>

  <!-- Saved card -->
  <section class="view" id="v-saved" hidden>
    <h2 class="h2" data-i18n="cardTitle">Your fish card</h2>
    <img class="fishcard" id="fishcard" alt="" />
    <p class="card-hint" id="card-hint" data-i18n="cardHint">Tap Save image, then “Save Image” to keep it in Photos.</p>
    <div class="btns">
      <button type="button" class="btn primary" id="save-card"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg><span data-i18n="cardSave">Save image</span></button>
      <button type="button" class="btn ghost" id="back-result" data-i18n="back">Back to result</button>
    </div>
  </section>

  <input id="camera" type="file" accept="image/*" capture="environment" />
  <input id="library" type="file" accept="image/*,video/*" />

  <p class="foot" data-i18n="disclaimer">AI identification can be wrong. Don't rely on it to judge whether a fish is safe to touch or eat.</p>
</main>

<script>
  // ---------------- Language (follows the phone) ----------------
  const I18N = {
    en: { tagline: "Snap a fish, get its name and fun facts", heroTitle: "What fish is that?", heroSub: "Take or choose a photo and get its name in seconds.",
      tips: ["Dive shots", "Aquariums", "Fish market"], take: "Take photo", choose: "Choose photo", newPhoto: "New photo", pickAnother: "Pick another",
      cropTitle: "Frame the fish", cropSub: "Drag the box over the fish you want identified.", cropHint: "Drag corners to resize · drag inside to move",
      identifyArea: "Identify this area", useWhole: "Use whole photo",
      status: ["Looking closely", "Checking fins and colors", "Comparing species", "Almost there"],
      alsoCalled: "Also called", confidence: { high: "High confidence", medium: "Medium confidence", low: "Low confidence" },
      labels: { Appearance: "Appearance", Habitat: "Habitat", Behavior: "Behavior", Diet: "Diet", Size: "Size", Safety: "Safety" },

  const LANG = (navigator.languages?.[0] || navigator.language || "en").replace("_", "-");

  // ---------------- Helpers ----------------
  const $ = (id) => document.getElementById(id);

  const ICONS = { Appearance: "🎨", Habitat: "🌊", Behavior: "🐟", Diet: "🦐", Size: "📏", Safety: "⚠️" };
  const VIEWS = ["start", "crop", "photo", "saved"];
  function show(view) {
    for (const v of VIEWS) $("v-" + v).hidden = v !== view;
    scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }
  $("home").addEventListener("click", () => { clearInterval(statusTimer); show("start"); });

  let source = null;      // canvas holding the full picked image (max 2400 px)
  let sent = null;        // { canvas, base64, dataUrl } of what was analyzed
  let result = null;      // last API answer
  let cardFile = null;    // generated card image (File)
  let statusTimer = null;

  // ---------------- Picking a photo or video ----------------
  for (const id of ["camera", "library"]) {
    $(id).addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      e.target.value = "";
      if (!file) return;
      try {
        source = file.type.startsWith("video/") ? await videoFrame(file) : await imageToCanvas(file);
      } catch (err) {
        return showError(err.message, false);
      }
      openCrop();
    });
  }

  function loadImage(src) {
    return new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = src; });
  }

  // Decodes the photo (Safari also decodes iPhone HEIC) into a canvas, capped at 2400 px.
  async function imageToCanvas(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await loadImage(url).catch(() => { throw new Error(T.errRead); });
      return drawScaled(img, img.naturalWidth, img.naturalHeight, 2400);
    } finally { URL.revokeObjectURL(url); }
  }

  // Grabs one still frame from a video (about a third of the way in).
  function videoFrame(file) {
    return new Promise((ok, fail) => {
      const url = URL.createObjectURL(file);
      const v = document.createElement("video");
      const done = (fn, arg) => { clearTimeout(timer); URL.revokeObjectURL(url); v.removeAttribute("src"); v.load(); fn(arg); };
      const timer = setTimeout(() => done(fail, new Error(T.errVideo)), 15000);
      v.muted = true; v.playsInline = true; v.preload = "auto";
      v.onerror = () => done(fail, new Error(T.errVideo));
      v.onloadeddata = () => { v.currentTime = Math.min(Math.max(v.duration * 0.33, 0.1), Math.max(v.duration - 0.1, 0)); };
      v.onseeked = () => {
        try { done(ok, drawScaled(v, v.videoWidth, v.videoHeight, 2400)); } catch { done(fail, new Error(T.errVideo)); }
      };

      v.load();
    });

  function drawScaled(src, w, h, max, sx = 0, sy = 0, sw = w, sh = h) {

  function openCrop() {

  function drawBox() {

  }

    const box = $("box"); const MIN = 50; let drag = null;
    box.addEventListener("pointerdown", (e) => {
      drag = { h: e.target.dataset.h || "move", sx: e.clientX, sy: e.clientY, r0: { ...crop } };
      box.setPointerCapture(e.pointerId); e.preventDefault();
    });
    box.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const img = $("crop-img"), W = img.clientWidth, H = img.clientHeight;
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy, o = drag.r0;
      let { x, y, w, h } = o;
      if (drag.h === "move") { x = Math.min(Math.max(0, o.x + dx), W - o.w); y = Math.min(Math.max(0, o.y + dy), H - o.h); }
      if (drag.h.includes("w")) { x = Math.min(Math.max(0, o.x + dx), o.x + o.w - MIN); w = o.w + (o.x - x); }
      if (drag.h.includes("e")) { w = Math.min(Math.max(MIN, o.w + dx), W - o.x); }
      if (drag.h.includes("n")) { y = Math.min(Math.max(0, o.y + dy), o.y + o.h - MIN); h = o.h + (o.y - y); }
      if (drag.h.includes("s")) { h = Math.min(Math.max(MIN, o.h + dy), H - o.y); }

      ${d.note ? `<div class="note">💡 ${esc(d.note)}</div>` : ""}
      <div class="card-actions">
        <button type="button" class="mini" id="open-card"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>${esc(T.saveCard)}</button>
        <label class="mini" for="library"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.4A1.5 1.5 0 0 1 9.9 5h4.2a1.5 1.5 0 0 1 1.3.6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>${esc(T.newPhoto)}</label>
      </div>`);
    $("open-card").addEventListener("click", openSavedCard);
    cardFile = null;
    buildCard(d).catch((e) => console.error("card", e)); // prepared ahead so "Save image" can open the share sheet instantly
  }

  // ---------------- Saved card (1080 x 1350 image) ----------------
  let cardPromise = null;
  function buildCard(d) {
    cardPromise = (async () => {
      await Promise.all([
        document.fonts.load('800 72px "Bricolage Grotesque"'), document.fonts.load('600 30px "Inter"'),
        document.fonts.load('italic 400 38px "Inter"'),
      ]).catch(() => {});
      const W = 1080, H = 1350, P = 48, c = document.createElement("canvas");
      c.width = W; c.height = H;
      const g = c.getContext("2d");
      const display = '"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif', body = '"Inter", -apple-system, system-ui, sans-serif';

      // Water background
      let bg = g.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#0b5f7a"); bg.addColorStop(0.55, "#06263a"); bg.addColorStop(1, "#020d16");
      g.fillStyle = bg; g.fillRect(0, 0, W, H);
      const glow = g.createRadialGradient(W / 2, -120, 40, W / 2, -120, 760);
      glow.addColorStop(0, "rgba(42,208,224,0.55)"); glow.addColorStop(1, "rgba(42,208,224,0)");
      g.fillStyle = glow; g.fillRect(0, 0, W, H);

      // Measure the text block first, then give the photo the remaining height
      g.font = `800 76px ${display}`;
      const nameLines = wrap(g, d.common_name, W - P * 2, 2);
      const statFacts = pickStats(d.facts || []);
      const textH = nameLines.length * 82 + 56 + 28 + (statFacts.length ? 220 : 0) + 84;
      const photoH = H - P * 2 - textH - 24;

      // Photo (cover-fit, rounded)
      roundRect(g, P, P, W - P * 2, photoH, 40); g.save(); g.clip();
      const sc = sent.canvas, k = Math.max((W - P * 2) / sc.width, photoH / sc.height);
      const dw = sc.width * k, dh = sc.height * k;
      g.drawImage(sc, P + (W - P * 2 - dw) / 2, P + (photoH - dh) / 2, dw, dh);
      g.restore();

      // Confidence badge
      const confColor = { high: "#34d399", medium: "#facc15", low: "#f87171" }[d.confidence] || "#34d399";
      const label = T.confidence[d.confidence] || d.confidence;
      g.font = `700 30px ${body}`;
      const bw = g.measureText(label).width + 74;
      roundRect(g, P + 24, P + 24, bw, 56, 28); g.fillStyle = "rgba(2,13,22,0.72)"; g.fill();
      g.beginPath(); g.arc(P + 52, P + 52, 8, 0, Math.PI * 2); g.fillStyle = confColor; g.fill();
      g.fillStyle = "#e9fbff"; g.textBaseline = "middle"; g.fillText(label, P + 70, P + 53);

      // Name + Latin name
      let y = P + photoH + 30;
      g.textBaseline = "top"; g.fillStyle = "#e9fbff"; g.font = `800 76px ${display}`;
      for (const line of nameLines) { g.fillText(line, P, y); y += 82; }
      g.font = `italic 400 38px ${body}`; g.fillStyle = "#a7c9d6";
      g.fillText(ellipsize(g, d.scientific_name, W - P * 2), P, y + 4); y += 56 + 28;

      // Three quick facts
      if (statFacts.length) {
        const gap = 18, bw2 = (W - P * 2 - gap * (statFacts.length - 1)) / statFacts.length, bh = 196;
        statFacts.forEach((f, i) => {
          const x = P + i * (bw2 + gap);
          roundRect(g, x, y, bw2, bh, 26); g.fillStyle = "rgba(190,240,255,0.12)"; g.fill();
          g.strokeStyle = "rgba(190,240,255,0.22)"; g.lineWidth = 2; g.stroke();
          g.fillStyle = "#7cf3ff"; g.font = `700 24px ${body}`;
          g.fillText(ellipsize(g, (T.labels[f.label] || f.label).toUpperCase(), bw2 - 44), x + 22, y + 22);
          g.fillStyle = "#e9fbff"; g.font = `600 31px ${body}`;
          wrap(g, f.short || f.text, bw2 - 44, 3).forEach((ln, n) => g.fillText(ln, x + 22, y + 64 + n * 40));
        });
        y += bh + 24;
      }

      // Footer: brand + date
      const fy = H - P - 44;
      roundRect(g, P, fy, 44, 44, 13);
      const mg = g.createLinearGradient(P, fy, P + 44, fy + 44); mg.addColorStop(0, "#ffe27a"); mg.addColorStop(1, "#ffb347");
      g.fillStyle = mg; g.fill();
      g.save(); g.translate(P + 8, fy + 8); g.scale(28 / 32, 28 / 32);
      g.fillStyle = "#0a2a3a"; g.fill(new Path2D("M4 16c4-7 12-9 19-5l5-4v18l-5-4c-7 4-15 2-19-5z")); g.restore();
      g.textBaseline = "middle"; g.fillStyle = "#e9fbff"; g.font = `700 32px ${body}`; g.fillText("Fish Wizard", P + 60, fy + 23);
      g.fillStyle = "#a7c9d6"; g.font = `500 28px ${body}`; g.textAlign = "right";
      g.fillText(new Intl.DateTimeFormat(LANG, { day: "numeric", month: "short", year: "numeric" }).format(new Date()), W - P, fy + 23);
      g.textAlign = "left";

      const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.92));
      const name = (d.common_name || "fish").replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "").slice(0, 40) || "fish";
      cardFile = new File([blob], `fish-wizard-${name}.jpg`, { type: "image/jpeg" });
      return cardFile;
    })();
    return cardPromise;
  }

  function pickStats(facts) {
    const order = ["Habitat", "Size", "Diet", "Behavior", "Safety", "Appearance"];
    return order.map((l) => facts.find((f) => f.label === l)).filter(Boolean).slice(0, 3);
  }
  function roundRect(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function ellipsize(g, text, max) {
    text = String(text || "");
    if (g.measureText(text).width <= max) return text;
    while (text && g.measureText(text + "…").width > max) text = text.slice(0, -1);
    return text.trimEnd() + "…";
  }
  // Wraps by words (or by characters for languages without spaces), up to maxLines.
  function wrap(g, text, max, maxLines) {
    const tokens = /\s/.test(text) ? String(text).split(/(\s+)/) : Array.from(String(text || ""));
    const lines = []; let line = "";
    for (const t of tokens) {
      if (g.measureText(line + t).width <= max || !line.trim()) { line += t; continue; }
      lines.push(line.trim()); line = t.trimStart();
      if (lines.length === maxLines) break;
    }
    if (lines.length < maxLines && line.trim()) lines.push(line.trim());
    const usedAll = lines.join("").replace(/\s/g, "").length >= String(text).replace(/\s/g, "").length;
    if (!usedAll && lines.length) lines[lines.length - 1] = ellipsize(g, lines[lines.length - 1] + "…", max);
    return lines.length ? lines : [""];
  }

  async function openSavedCard() {
    const file = cardFile || await cardPromise;
    if (!file) return;
    const img = $("fishcard");
    if (img.dataset.url) URL.revokeObjectURL(img.dataset.url);
    img.dataset.url = URL.createObjectURL(file);
    img.src = img.dataset.url;
    img.alt = result?.common_name || "";
    show("saved");
  }

  $("save-card").addEventListener("click", async () => {
    if (!cardFile) return;
    // iPhone/Android: the share sheet offers "Save Image" (to Photos), Messages, WhatsApp...
    if (navigator.canShare?.({ files: [cardFile] })) {
      try { await navigator.share({ files: [cardFile], title: result?.common_name || "Fish Wizard" }); } catch {}
      return;
    }
    // Desktop fallback: plain download
    const a = document.createElement("a");
    a.href = URL.createObjectURL(cardFile); a.download = cardFile.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
  $("back-result").addEventListener("click", () => show("photo"));

  // ---------------- Drifting particles ----------------
  (() => {
    const cv = $("snow"), ctx = cv.getContext("2d");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let parts = [], w = 0, h = 0;
    function size() {
      const d = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight;
      cv.width = w * d; cv.height = h * d; ctx.setTransform(d, 0, 0, d, 0, 0);
      parts = Array.from({ length: Math.round(w * h / 9000) }, () => ({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.6 + .4, v: Math.random() * .25 + .08, a: Math.random() * .5 + .15, p: Math.random() * 6 }));
    }
    function tick(t) {
      ctx.clearRect(0, 0, w, h);
      for (const q of parts) {
        q.y -= q.v; q.x += Math.sin(t / 2000 + q.p) * .15;
        if (q.y < -4) { q.y = h + 4; q.x = Math.random() * w; }
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fillStyle = `rgba(200,245,255,${q.a * (q.y / h)})`; ctx.fill();
      }
      if (!reduce && !document.hidden) requestAnimationFrame(tick);
    }
    size(); addEventListener("resize", size); requestAnimationFrame(tick);
    document.addEventListener("visibilitychange", () => { if (!document.hidden && !reduce) requestAnimationFrame(tick); });
  })();
</script>
</body>

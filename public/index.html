<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fish Wizard</title>
  <meta name="description" content="Snap or upload a photo of a fish and get a quick ID card." />
  <meta name="theme-color" content="#0b2a3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐠</text></svg>" />
  <style>
    :root {
      --bg: #f3f7f9; --card: #ffffff; --text: #10202a; --muted: #5b6f7a;
      --accent: #0a7ea4; --accent-text: #ffffff; --border: #dde6eb; --error: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1418; --card: #172127; --text: #e8f0f3; --muted: #94a8b2;
        --accent: #38b2d8; --accent-text: #04202b; --border: #26343c; --error: #ff8a80; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px 48px; }
    h1 { font-size: 28px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .picker { display: flex; gap: 12px; }
    .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 52px; border-radius: 14px; border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 17px; font-weight: 600; cursor: pointer; }
    .btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
    input[type=file] { display: none; }
    .preview { margin-top: 20px; width: 100%; border-radius: 18px; display: none; max-height: 420px; object-fit: cover; }
    .bubble { margin-top: 16px; background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; padding: 18px; display: none; }
    .bubble h2 { font-size: 22px; margin: 0; }
    .sci { font-style: italic; color: var(--muted); }
    .aka { color: var(--muted); font-size: 15px; margin-top: 2px; }
    .badge { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 99px;
      border: 1px solid var(--border); color: var(--muted); margin-top: 8px; }
    .bubble ul { padding-left: 20px; margin: 12px 0 0; }
    .bubble li { margin-bottom: 8px; }
    .note { color: var(--muted); font-size: 15px; margin-top: 8px; }
    .error { color: var(--error); }
    .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); }
    .spinner { width: 20px; height: 20px; border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { margin-top: 32px; color: var(--muted); font-size: 13px; text-align: center; }
  </style>
</head>
<body>
<main>
  <h1>🐠 Fish Wizard</h1>
  <p class="sub">Snap or pick a photo of a fish. Get a quick ID card.</p>

  <div class="picker">
    <label class="btn primary" for="camera">📷 Take photo</label>
    <label class="btn" for="library">🖼️ Choose photo</label>
  </div>
  <input id="camera" type="file" accept="image/*" capture="environment" />
  <input id="library" type="file" accept="image/*" />

  <img id="preview" class="preview" alt="Your photo" />
  <section id="bubble" class="bubble" aria-live="polite"></section>

  <footer>AI identification can be wrong. Don't rely on it to judge whether a fish is safe to touch or eat.</footer>
</main>

<script>
  const preview = document.getElementById("preview");
  const bubble = document.getElementById("bubble");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  for (const id of ["camera", "library"]) {
    document.getElementById(id).addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      e.target.value = "";
      if (file) identify(file);
    });
  }

  // Downscale to a JPEG (also converts iPhone HEIC photos, since Safari decodes them).
  async function toJpegBase64(file, maxSide = 1568) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((resolve, reject) => {
        const i = new Image();
        i.onload = () => resolve(i);
        i.onerror = () => reject(new Error("Couldn't read that image."));
        i.src = url;
      });
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
      return { dataUrl, base64: dataUrl.split(",")[1] };
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function show(html) { bubble.innerHTML = html; bubble.style.display = "block"; }

  async function identify(file) {
    show('<div class="loading"><div class="spinner"></div>Looking closely at your fish…</div>');
    try {
      const { dataUrl, base64 } = await toJpegBase64(file);
      preview.src = dataUrl;
      preview.style.display = "block";

      const r = await fetch("/api/identify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: base64, mediaType: "image/jpeg" }),
      });
      const data = await r.json().catch(() => null);
      if (!r.ok || !data) throw new Error(data?.error || "Something went wrong. Please try again.");
      render(data);
    } catch (err) {
      show(`<p class="error">${esc(err.message)}</p>`);
    }
  }

  function render(d) {
    if (!d.found) {
      show(`<h2>No fish spotted 🤔</h2><p>${esc(d.summary)}</p>`);
      return;
    }
    const aka = d.other_names?.length ? `<div class="aka">Also called ${d.other_names.map(esc).join(", ")}</div>` : "";
    const facts = (d.facts || []).map((f) => `<li><strong>${esc(f.label)}:</strong> ${esc(f.text)}</li>`).join("");
    show(`
      <h2>${esc(d.common_name)}</h2>
      <div class="sci">${esc(d.scientific_name)}</div>
      ${aka}
      <span class="badge">${esc(d.confidence)} confidence</span>
      <p>${esc(d.summary)}</p>
      <ul>${facts}</ul>
      ${d.note ? `<p class="note">${esc(d.note)}</p>` : ""}
    `);
  }
</script>
</body>
</html>
